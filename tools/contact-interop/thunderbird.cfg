// Synthetic contact test configuration, copied only into the isolated test application.
pref("contact.gate.loaded", true);
Components.utils.importGlobalProperties(["IOUtils"]);
let gateStage = "startup";
Services.console.registerListener({ observe(message) {
  try {
    const error = message.QueryInterface(Ci.nsIScriptError);
    dump("CONTACT_GATE_DIAGNOSTIC " + JSON.stringify({stage: gateStage, message: error.errorMessage,
      source: error.sourceName, line: error.lineNumber, category: error.category, stack: String(error.stack)}) + "\n");
  } catch (_error) { /* Non-script console messages keep their normal output. */ }
} });
Services.obs.addObserver(function contactGate() {
  Services.obs.removeObserver(contactGate, "mail-startup-idle-tasks-finished");
  Services.startup.enterLastWindowClosingSurvivalArea();
  (async () => {
    const root = Services.env.get("CONTACT_INTEROP_HOME");
    const profile = Services.dirsvc.get("ProfD", Ci.nsIFile).path;
    if (!root.startsWith("/tmp/opencode/") || !profile.startsWith(root + "/thunderbird-profile-")) {
      throw new Error("Refusing non-test profile");
    }
    let result;
    try {
      const window = Services.wm.getMostRecentWindow("mail:3pane");
      await new Promise(resolve => window.requestAnimationFrame(() => window.requestAnimationFrame(resolve)));
      const { TelemetryController } = ChromeUtils.importESModule("resource://gre/modules/TelemetryController.sys.mjs");
      await TelemetryController.promiseInitialized();
      const input = await IOUtils.readJSON(root + "/thunderbird-input.json");
      gateStage = "contacts";
      const { VCardUtils } = ChromeUtils.importESModule("resource:///modules/VCardUtils.sys.mjs");
      const { MailServices } = ChromeUtils.importESModule("resource:///modules/MailServices.sys.mjs");
      const book = MailServices.ab.getDirectory("jsaddrbook://abook.sqlite");
      const snapshot = card => {
        const properties = card.vCardProperties.toPropertyMap();
        return {
          uid: card.UID, first: card.firstName, last: card.lastName, display: card.displayName,
          birthday: ["BirthYear", "BirthMonth", "BirthDay"].map(p => String(properties.get(p) || "")),
          anniversary: ["AnniversaryYear", "AnniversaryMonth", "AnniversaryDay"].map(p => String(properties.get(p) || "")),
          entries: card.vCardProperties.entries.map(e => ({name: e.name, type: e.type, value: e.value, params: e.params})),
          vcard: card.vCardProperties.toVCard(),
        };
      };
      const imported = [];
      if (input.phase === "import") {
        for (const entry of input.cards) {
          const card = VCardUtils.vCardToAbCard(entry.text);
          if (Array.from(book.childCards).some(c => c.UID === card.UID)) book.modifyCard(card);
          else book.addCard(card);
          imported.push(snapshot(Array.from(book.childCards).find(c => c.UID === card.UID)));
        }
      }
      result = {version: Services.appinfo.version, imported, saved: Array.from(book.childCards, snapshot)};
    } catch (error) {
      result = {error: String(error), stack: error.stack};
    }
    await IOUtils.writeJSON(root + "/thunderbird-output.json", result);
    Services.tm.dispatchToMainThread(() => {
      gateStage = "shutdown";
      Services.startup.exitLastWindowClosingSurvivalArea();
      const window = Services.wm.getMostRecentWindow("mail:3pane");
      window.setTimeout(window.goQuitApplication, 0);
    });
  })().catch(error => {
    dump("CONTACT_GATE_FATAL " + error + "\n");
    Services.startup.quit(Ci.nsIAppStartup.eForceQuit);
  });
}, "mail-startup-idle-tasks-finished");
