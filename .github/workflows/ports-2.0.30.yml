name: Organizer 2.0.30 port candidates

on:
  workflow_dispatch:
    inputs:
      target:
        description: Candidate to build (tablet-system-records is API34 provider-only; tablet-build-only skips native runtime; tablet-aosp is diagnostic only)
        type: choice
        default: all
        options: [all, macos, tablet, tablet-aosp, tablet-components, tablet-api26-components, tablet-timezone-interop, tablet-build-only, tablet-system-records]
      component:
        description: Only filters tablet-components and tablet-api26-components; never full UI acceptance
        type: choice
        default: all
        options: [all, services, files, domains]
  push:
    branches: [codex/ports-2.0.30]
    paths:
      - '.github/workflows/ports-2.0.30.yml'
      - 'Magnolie-Organizer-macOS-Beta/**'
      - 'Magnolie-Organizer-Android-Tablet-Beta/**'

permissions:
  contents: read

concurrency:
  group: ports-2.0.30-${{ github.ref }}-${{ inputs.target || 'all' }}
  cancel-in-progress: false

env:
  DESKTOP_COMMIT: 067c38934b539943d8e1720abafd8a80b401d797

jobs:
  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'macos'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      MACOS_ARCH: ${{ matrix.arch }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Bind the Mac candidate to the current selected checkout
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/port-proof"
          python3 Magnolie-Organizer-macOS-Beta/tests/test_candidate_sources.py
          python3 Magnolie-Organizer-macOS-Beta/tools/candidate_sources.py record --expected-commit "$GITHUB_SHA" \
            --proof "$RUNNER_TEMP/port-proof/sources.json"
          python3 Magnolie-Organizer-macOS-Beta/tools/check_cloud_environment.py \
            --name "GitHub macOS VM $MACOS_ARCH" --require-native-build \
            --output "$RUNNER_TEMP/port-proof/environment-$MACOS_ARCH.json"
      - name: Prepare private dependencies and canonical catalogs
        run: |
          set -euo pipefail
          if ! brew list gettext >/dev/null 2>&1; then brew install gettext; fi
          export PATH="$(brew --prefix gettext)/bin:$PATH"
          python3 Magnolie-Organizer-macOS-Beta/tools/project_import_helper.py --prepare-dependencies
          python3 -m venv "$RUNNER_TEMP/mac-python"
          "$RUNNER_TEMP/mac-python/bin/pip" install --disable-pip-version-check cryptography==46.0.3
          npm install --prefix "$RUNNER_TEMP/mac-js" --ignore-scripts --no-audit --no-fund --save-exact jsdom@26.1.0
          cd magnolie-organizer
          mkdir -p web/i18n
          while read -r language; do
            python3 werkzeuge/po_zu_js.py "$language" "po/$language.po" "web/i18n/$language.js"
          done < po/LINGUAS
      - name: Verify the standalone Swift time-zone engine against independent references
        working-directory: Magnolie-Organizer-macOS-Beta
        timeout-minutes: 12
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$MACOS_ARCH"
          curl --fail --location --max-time 120 --proto '=https' --proto-redir '=https' --tlsv1.2 \
            'https://github.com/JodaOrg/global-tz/releases/download/2026egtz/tzdata2026egtz-rearguard.tar.gz' \
            --output "$RUNNER_TEMP/tzdata2026egtz-rearguard.tar.gz"
          python3 - <<'PY'
          import hashlib, os, pathlib
          archive = pathlib.Path(os.environ['RUNNER_TEMP'], 'tzdata2026egtz-rearguard.tar.gz')
          if archive.stat().st_size > 8 * 1024 * 1024:
              raise SystemExit('Unexpected time-zone reference archive size')
          if hashlib.sha256(archive.read_bytes()).hexdigest() != '0f391ed721b54225189a1c5cac469fa24a07c1283e9e460650fd28155e19240d':
              raise SystemExit('Time-zone reference archive checksum mismatch')
          PY
          python3 tools/check_timezone_provider.py --definitions --swift "$(command -v swift)" \
            --archive "$RUNNER_TEMP/tzdata2026egtz-rearguard.tar.gz" \
            | tee "$RUNNER_TEMP/port-proof/timezone-provider-$MACOS_ARCH.log"
      - name: Build the private source-pinned import runtime
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python3 Magnolie-Organizer-macOS-Beta/tests/test_import_python_bundle.py
          python3 Magnolie-Organizer-macOS-Beta/tests/test_airplay_bundle.py
          python3 Magnolie-Organizer-macOS-Beta/tools/import_python_bundle.py \
            --download --source-archive "$RUNNER_TEMP/Python-3.15.2.tar.xz" \
            --output "$RUNNER_TEMP/import-python" \
            > "$RUNNER_TEMP/port-proof/import-python-$MACOS_ARCH.log" 2>&1
          cp "$RUNNER_TEMP/import-python/runtime.json" "$RUNNER_TEMP/port-proof/import-python-$MACOS_ARCH.json"
      - name: Freeze this isolated build's current source and run host and Apple tests
        working-directory: Magnolie-Organizer-macOS-Beta
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix gettext)/bin:$PATH"
          export MACOS_BETA_IMPORT_PYTHON="$RUNNER_TEMP/import-python/ImportPython.app/Contents/MacOS/python3.15"
          "$RUNNER_TEMP/mac-python/bin/python" tests/test_import_helper.py
          python3 tools/project_ui.py freeze --confirm-desktop-frozen
          python3 tools/project_ui.py generate
          export MACOS_BETA_JSDOM="$RUNNER_TEMP/mac-js/node_modules/jsdom/lib/api.js"
          export MACOS_BETA_SWIFT="$(command -v swift)"
          export MACOS_BETA_UI_PATH="$PWD/Generated"
          python3 tools/check_current_sources.py --js-runtime node
          python3 tools/check_file_import.py --js-runtime node --ui "$PWD/Generated"
          "$RUNNER_TEMP/mac-python/bin/python" tools/crypto_vectors.py --check
          "$RUNNER_TEMP/mac-python/bin/python" tests/test_host.py
          MACOS_BETA_LIVE_HOLIDAYS=1 python3 tools/build_dev.py --import-runtime "$RUNNER_TEMP/import-python"
          python3 tools/project_ui.py check
      - name: Exercise the actual Swift import process and packaged private runtime
        working-directory: Magnolie-Organizer-macOS-Beta
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 tools/check_native_file_import_process.py \
            --bundle "$PWD/Output/Magnolie Organizer macOS Beta-2.0.30-beta.1/Magnolie Organizer macOS Beta.app" \
            --sources "$RUNNER_TEMP/port-proof/sources.json" --expected-commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/port-proof/native-file-import-process-$MACOS_ARCH.json"
      - name: Verify optimized Swift code for the later stable integration
        working-directory: Magnolie-Organizer-macOS-Beta
        timeout-minutes: 12
        run: |
          set -euo pipefail
          # Refs #121: optimization is a separate test context. The packaged
          # candidate remains the explicitly identified ad-hoc Debug app.
          export MACOSX_DEPLOYMENT_TARGET=12.7
          export MACOS_BETA_UI_PATH="$PWD/Generated"
          export MACOS_BETA_JSDOM="$RUNNER_TEMP/mac-js/node_modules/jsdom/lib/api.js"
          export MACOS_BETA_IMPORT_PYTHON="$RUNNER_TEMP/import-python/ImportPython.app/Contents/MacOS/python3.15"
          MACOS_BETA_LIVE_HOLIDAYS=1 swift test -c release --jobs 2 \
            2>&1 | tee "$RUNNER_TEMP/port-proof/swift-release-$MACOS_ARCH.log"
          python3 tools/project_ui.py check
      - name: Start, save, quit and reopen the real app bundle
        working-directory: Magnolie-Organizer-macOS-Beta
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$MACOS_ARCH"
          swift tools/smoke_app.swift "$PWD/Output/Magnolie Organizer macOS Beta-2.0.30-beta.1/Magnolie Organizer macOS Beta.app" "$RUNNER_TEMP/port-proof"
      - name: Package the ad-hoc development app with its evidence
        working-directory: Magnolie-Organizer-macOS-Beta
        run: |
          set -euo pipefail
          output='Output/Magnolie Organizer macOS Beta-2.0.30-beta.1'
          app="$output/Magnolie Organizer macOS Beta.app"
          python3 tools/candidate_sources.py verify --expected-commit "$GITHUB_SHA" \
            --proof "$RUNNER_TEMP/port-proof/sources.json"
          codesign --verify --strict "$app"
          cp "$RUNNER_TEMP/port-proof/sources.json" "$output/sources.json"
          cp SourceFreeze.json "$output/SourceFreeze.json"
          cp README.md FEATURE-MATRIX.md "$output/"
          ditto -c -k --sequesterRsrc --keepParent "$output" "$RUNNER_TEMP/port-proof/Magnolie-Organizer-macOS-2.0.30-beta.1-$MACOS_ARCH.zip"
          cd "$RUNNER_TEMP/port-proof"
          shasum -a 256 Magnolie-Organizer-macOS-2.0.30-beta.1-$MACOS_ARCH.zip > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macOS-2.0.30-beta.1-${{ matrix.arch }}-development-candidate
          path: ${{ runner.temp }}/port-proof/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve native failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macOS-2.0.30-beta.1-${{ matrix.arch }}-failure-diagnostics
          path: ${{ runner.temp }}/port-proof/
          if-no-files-found: warn
          retention-days: 14

  tablet:
    name: ${{ inputs.target == 'tablet-build-only' && 'tablet-build-only-no-native-acceptance' || inputs.target == 'tablet-system-records' && 'tablet-system-records-API34-provider-only' || inputs.target == 'tablet-timezone-interop' && 'tablet-timezone-interop-comparison-only' || inputs.target == 'tablet-api26-components' && format('tablet-API26-component-only-{0}', matrix.suite) || inputs.target == 'tablet-aosp' && 'tablet-AOSP-API34-diagnostic-only' || inputs.target == 'tablet-components' && format('tablet-component-only-{0}', matrix.suite) || 'tablet' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # Refs #461/#790/#791: explicit build/provider targets; existing native targets retain their suites.
        suite: ${{ fromJSON(inputs.target == 'tablet-build-only' && '["build"]' || inputs.target == 'tablet-system-records' && '["system-records"]' || (inputs.target == 'tablet-components' || inputs.target == 'tablet-api26-components') && (inputs.component == 'services' && '["services"]' || inputs.component == 'files' && '["files"]' || inputs.component == 'domains' && '["domains"]' || '["services","files","domains"]') || inputs.target == 'tablet-timezone-interop' && '["timezone"]' || '["ui"]') }}
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'macos'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TABLET_RUNTIME_API: ${{ inputs.target == 'tablet-api26-components' && '26' || '34' }}
      TABLET_COMPONENT_SUITE: ${{ matrix.suite }}
      TABLET_SYSTEM_IMAGE: ${{ inputs.target == 'tablet-aosp' && 'default' || 'google_apis' }}
      MAGNOLIE_JS_RUNTIME: node
      NODE_PATH: ${{ github.workspace }}/.ci-js/node_modules
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Bind the tablet to the unchanged current checkout
        shell: bash
        run: |
          set -euo pipefail
          # The published tag remains an independent codec oracle, not the build source.
          test "$(git rev-parse v2.0.30^{commit})" = "$DESKTOP_COMMIT"
          python3 -B Magnolie-Organizer-Android-Tablet-Beta/tests/test_source_proof.py
          python3 -B Magnolie-Organizer-Android-Tablet-Beta/tools/source-proof.py capture \
            --expected-commit "$GITHUB_SHA" \
            --output Magnolie-Organizer-Android-Tablet-Beta/artifacts/source-checkout.json
      - name: Prepare the existing resource-limited build gate
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gettext openjdk-21-jdk-headless libvirt-daemon-system libvirt-clients acl
          sudo systemctl start libvirtd
          sudo setfacl -m "u:$(id -un):rw" /run/libvirt/libvirt-sock
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          timeout 600 "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.2' 'build-tools;36.0.0'
          test -f "$ANDROID_HOME/platforms/android-37.2/android.jar"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          npm install --prefix .ci-js --ignore-scripts --no-audit --no-fund --save-exact jsdom@26.1.0
          cd magnolie-organizer
          mkdir -p web/i18n
          while read -r language; do
            python3 werkzeuge/po_zu_js.py "$language" "po/$language.po" "web/i18n/$language.js"
          done < po/LINGUAS
          cd ..
          mkdir -p /tmp/opencode "$GITHUB_WORKSPACE/../Test-VMs-20260912" "$HOME/.local/share/magnolie-testing/vms/rebuild-20260912"
          mkdir -p Magnolie-Organizer-Android-Tablet-Beta/artifacts
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Build and verify debug APKs within the original locks and resource limits
        id: tablet_build
        working-directory: Magnolie-Organizer-Android-Tablet-Beta
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build-beta.sh --readiness
          bash tools/build-beta.sh --online
          python3 -B tools/source-proof.py bind \
            --proof artifacts/source-checkout.json \
            --projection app/build/generated/projection/assets/projection.json \
            --candidate artifacts/candidate.json --output artifacts/sources.json
          python3 - <<'PY'
          import json, os, pathlib
          proof = json.loads(pathlib.Path('artifacts/sources.json').read_text())
          build_only = os.environ['TABLET_COMPONENT_SUITE'] == 'build'
          proof.update(referenceDesktopTag='v2.0.30',
                       referenceDesktopCommit=os.environ['DESKTOP_COMMIT'],
                       buildOnly=build_only,
                       systemImage=None if build_only else os.environ['TABLET_SYSTEM_IMAGE'],
                       diagnosticComparison=not build_only and os.environ['TABLET_SYSTEM_IMAGE'] == 'default',
                       runtimeApi=None if build_only else int(os.environ['TABLET_RUNTIME_API']),
                       componentOnly=not build_only and os.environ['TABLET_COMPONENT_SUITE'] != 'ui',
                       componentSuite=None if build_only else os.environ['TABLET_COMPONENT_SUITE'],
                       systemProviderOnly=os.environ['TABLET_COMPONENT_SUITE'] == 'system-records',
                       googleAcceptance=False)
          pathlib.Path('artifacts/sources.json').write_text(json.dumps(proof, indent=2)+'\n')
          if build_only:
              print('BUILD-ONLY EVIDENCE: debug APKs verified; no Android runtime or native acceptance.')
          PY
      - name: Prepare the official Android runtime image
        if: matrix.suite != 'build'
        working-directory: Magnolie-Organizer-Android-Tablet-Beta
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          if [ "$TABLET_COMPONENT_SUITE" != ui ]; then
            echo 'COMPONENT-ONLY EVIDENCE: no UI or full Google tablet acceptance is claimed.'
          fi
          case "$TABLET_RUNTIME_API:$TABLET_SYSTEM_IMAGE" in 26:google_apis|34:google_apis|34:default) ;; *) exit 2 ;; esac
          if [ "$TABLET_SYSTEM_IMAGE" = default ]; then
            echo 'AOSP API34 DIAGNOSTIC ONLY: this result is not Google tablet or production acceptance.'
          fi
          timeout 600 "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'emulator' "system-images;android-$TABLET_RUNTIME_API;$TABLET_SYSTEM_IMAGE;x86_64"
      - name: Exercise the candidate in the owned Android tablet emulator
        if: matrix.suite == 'ui'
        working-directory: Magnolie-Organizer-Android-Tablet-Beta
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          # This dedicated runner has no concurrent Windows/Android native work.
          # The owner retains all five leases through emulator cleanup.
          systemd-run --user --wait --pipe --collect \
            --setenv="ANDROID_HOME=$ANDROID_HOME" --setenv="ANDROID_SDK_ROOT=$ANDROID_HOME" \
            --setenv="JAVA_HOME=$JAVA_HOME" --setenv="MAGNOLIE_JS_RUNTIME=node" \
            --setenv="NODE_PATH=$NODE_PATH" \
            -p MemoryMax=6G -p MemorySwapMax=0 -p CPUQuota=200% -p RuntimeMaxSec=620 \
            -p TimeoutStopSec=10 -p KillMode=control-group -p UMask=0077 \
            --working-directory="$PWD" python3 -B tools/native-checks.py --main-slot-granted --suite ui --image "$TABLET_SYSTEM_IMAGE" --api "$TABLET_RUNTIME_API" </dev/null
      - name: Verify Android DAV parser and Keystore transactions independently of UI timing
        if: ${{ !cancelled() && steps.tablet_build.outcome == 'success' && (matrix.suite == 'ui' || matrix.suite == 'services') }}
        working-directory: Magnolie-Organizer-Android-Tablet-Beta
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -d "$ANDROID_HOME/system-images/android-$TABLET_RUNTIME_API/$TABLET_SYSTEM_IMAGE/x86_64"
          # A separate fresh session proves platform services without changing the UI suite's
          # cold-start conditions. Failed UI checks still fail this job.
          systemd-run --user --wait --pipe --collect \
            --setenv="ANDROID_HOME=$ANDROID_HOME" --setenv="ANDROID_SDK_ROOT=$ANDROID_HOME" \
            --setenv="JAVA_HOME=$JAVA_HOME" --setenv="MAGNOLIE_JS_RUNTIME=node" \
            --setenv="NODE_PATH=$NODE_PATH" \
            -p MemoryMax=6G -p MemorySwapMax=0 -p CPUQuota=200% -p RuntimeMaxSec=620 \
            -p TimeoutStopSec=10 -p KillMode=control-group -p UMask=0077 \
            --working-directory="$PWD" python3 -B tools/native-checks.py --main-slot-granted --suite services --image "$TABLET_SYSTEM_IMAGE" --api "$TABLET_RUNTIME_API" </dev/null
      - name: Exercise actual ICS import and export file pickers independently
        if: ${{ !cancelled() && steps.tablet_build.outcome == 'success' && (matrix.suite == 'ui' || matrix.suite == 'files') }}
        working-directory: Magnolie-Organizer-Android-Tablet-Beta
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -d "$ANDROID_HOME/system-images/android-$TABLET_RUNTIME_API/$TABLET_SYSTEM_IMAGE/x86_64"
          # The file workflow has its own fresh session and the same original limits.
          # It cannot turn a failed UI or platform-service check into acceptance.
          systemd-run --user --wait --pipe --collect \
            --setenv="ANDROID_HOME=$ANDROID_HOME" --setenv="ANDROID_SDK_ROOT=$ANDROID_HOME" \
            --setenv="JAVA_HOME=$JAVA_HOME" --setenv="MAGNOLIE_JS_RUNTIME=node" \
            --setenv="NODE_PATH=$NODE_PATH" \
            -p MemoryMax=6G -p MemorySwapMax=0 -p CPUQuota=200% -p RuntimeMaxSec=620 \
            -p TimeoutStopSec=10 -p KillMode=control-group -p UMask=0077 \
            --working-directory="$PWD" python3 -B tools/native-checks.py --main-slot-granted --suite files --image "$TABLET_SYSTEM_IMAGE" --api "$TABLET_RUNTIME_API" </dev/null
      - name: Verify health, custom design and drawing in an isolated component session
        if: ${{ !cancelled() && steps.tablet_build.outcome == 'success' && matrix.suite == 'domains' }}
        working-directory: Magnolie-Organizer-Android-Tablet-Beta
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -d "$ANDROID_HOME/system-images/android-$TABLET_RUNTIME_API/$TABLET_SYSTEM_IMAGE/x86_64"
          # Manual component evidence only; the original UI acceptance is unchanged.
          systemd-run --user --wait --pipe --collect \
            --setenv="ANDROID_HOME=$ANDROID_HOME" --setenv="ANDROID_SDK_ROOT=$ANDROID_HOME" \
            --setenv="JAVA_HOME=$JAVA_HOME" --setenv="MAGNOLIE_JS_RUNTIME=node" \
            --setenv="NODE_PATH=$NODE_PATH" \
            -p MemoryMax=6G -p MemorySwapMax=0 -p CPUQuota=200% -p RuntimeMaxSec=620 \
            -p TimeoutStopSec=10 -p KillMode=control-group -p UMask=0077 \
            --working-directory="$PWD" python3 -B tools/native-checks.py --main-slot-granted --suite domains --image "$TABLET_SYSTEM_IMAGE" --api "$TABLET_RUNTIME_API" </dev/null
      - name: Compare actual WebView and native time-zone clocks against independent golden data
        if: ${{ !cancelled() && steps.tablet_build.outcome == 'success' && matrix.suite == 'timezone' }}
        working-directory: Magnolie-Organizer-Android-Tablet-Beta
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -d "$ANDROID_HOME/system-images/android-$TABLET_RUNTIME_API/$TABLET_SYSTEM_IMAGE/x86_64"
          # Manual component evidence only; the original UI acceptance is unchanged.
          systemd-run --user --wait --pipe --collect \
            --setenv="ANDROID_HOME=$ANDROID_HOME" --setenv="ANDROID_SDK_ROOT=$ANDROID_HOME" \
            --setenv="JAVA_HOME=$JAVA_HOME" --setenv="MAGNOLIE_JS_RUNTIME=node" \
            --setenv="NODE_PATH=$NODE_PATH" \
            -p MemoryMax=6G -p MemorySwapMax=0 -p CPUQuota=200% -p RuntimeMaxSec=620 \
            -p TimeoutStopSec=10 -p KillMode=control-group -p UMask=0077 \
            --working-directory="$PWD" python3 -B tools/native-checks.py --main-slot-granted --suite timezone --image "$TABLET_SYSTEM_IMAGE" --api "$TABLET_RUNTIME_API" </dev/null
      - name: Verify local Android contacts and calendar providers in an isolated API34 session
        if: ${{ !cancelled() && steps.tablet_build.outcome == 'success' && matrix.suite == 'system-records' }}
        working-directory: Magnolie-Organizer-Android-Tablet-Beta
        shell: bash
        run: |
          set -euo pipefail
          test "$TABLET_RUNTIME_API:$TABLET_SYSTEM_IMAGE" = '34:google_apis'
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -d "$ANDROID_HOME/system-images/android-$TABLET_RUNTIME_API/$TABLET_SYSTEM_IMAGE/x86_64"
          # Explicit provider-only evidence. No permission-dialog, live revocation,
          # UI Save-ACK or full Google tablet acceptance is claimed by this suite.
          systemd-run --user --wait --pipe --collect \
            --setenv="ANDROID_HOME=$ANDROID_HOME" --setenv="ANDROID_SDK_ROOT=$ANDROID_HOME" \
            --setenv="JAVA_HOME=$JAVA_HOME" --setenv="MAGNOLIE_JS_RUNTIME=node" \
            --setenv="NODE_PATH=$NODE_PATH" \
            -p MemoryMax=6G -p MemorySwapMax=0 -p CPUQuota=200% -p RuntimeMaxSec=620 \
            -p TimeoutStopSec=10 -p KillMode=control-group -p UMask=0077 \
            --working-directory="$PWD" python3 -B tools/native-checks.py --main-slot-granted --suite system-records --image "$TABLET_SYSTEM_IMAGE" --api "$TABLET_RUNTIME_API" </dev/null
      - name: Collect synthetic native evidence
        if: ${{ always() && matrix.suite != 'build' }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          source = Path.home()/'.local/share/magnolie-testing/tablet-beta'
          target = Path('Magnolie-Organizer-Android-Tablet-Beta/artifacts/native-evidence')
          if source.exists():
              for run in source.iterdir():
                  if (run/'evidence').is_dir():
                      shutil.copytree(run/'evidence', target/run.name)
          PY
      - name: Preserve build diagnostics even when a gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Android-Tablet-2.0.30Beta-${{ inputs.target == 'tablet-build-only' && 'build-only-no-native-acceptance' || inputs.target == 'tablet-system-records' && 'system-records-API34-provider-only' || inputs.target == 'tablet-timezone-interop' && 'timezone-interop-comparison-only' || inputs.target == 'tablet-aosp' && 'AOSP-diagnostic-only' || inputs.target == 'tablet-api26-components' && format('API26-component-only-{0}', matrix.suite) || inputs.target == 'tablet-components' && format('component-only-{0}', matrix.suite) || 'Google-candidate' }}-and-proof
          path: |
            Magnolie-Organizer-Android-Tablet-Beta/artifacts/
            Magnolie-Organizer-Android-Tablet-Beta/app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 14
