name: Bug report / Fehlermeldung
description: Report a reproducible problem / Ein nachvollziehbares Problem melden
title: "[Bug] "
labels:
  - bug
body:
  - type: dropdown
    id: component
    attributes:
      label: Component / Bestandteil
      options:
        - Organizer for Linux
        - Organizer for Windows
        - Magnolie Notes for Android
        - Handbook / Handbuch
        - Release packaging / Freigabepakete
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and platform / Version und Plattform
      placeholder: "2.0.6, Debian 13 / Windows 11 / Android 16"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened? / Was ist passiert?
      description: Do not include personal data or secrets. / Keine persönlichen Daten oder Geheimnisse einfügen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Schritte zum Nachstellen
      placeholder: "1. Open ...\n2. Select ...\n3. See ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / Erwartetes Verhalten
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context / Weitere Angaben
